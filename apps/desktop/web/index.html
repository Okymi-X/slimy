<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Slimy</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; left: 0; top: 0; width: 400px; height: 400px; touch-action: none; will-change: transform; }
  #over { z-index: 2; }
  .bubble { position: fixed; left: 0; top: 0; z-index: 5; max-width: 280px; padding: 12px 14px; border-radius: 18px;
    background: rgba(246, 251, 255, 0.94); color: #10213b; font: 15px/1.45 system-ui, sans-serif;
    box-shadow: 0 6px 24px rgba(10, 30, 70, 0.28), inset 0 0 0 1px rgba(255, 255, 255, 0.7);
    opacity: 0; transition: opacity 0.18s ease; will-change: transform; user-select: text; -webkit-user-select: text; }
  .bubble.on { opacity: 1; }
  .bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -7px; width: 14px; height: 14px; margin-left: -7px;
    background: inherit; transform: rotate(45deg); border-radius: 3px; }
  .bubble.below::after { bottom: auto; top: -7px; }
  .bubble-text { margin: 0; }
  .bubble-form { display: flex; gap: 8px; margin-top: 10px; }
  .bubble-form[hidden] { display: none; }
  .bubble-form input { flex: 1; min-width: 0; font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid #9db8dd; background: #fff; color: inherit; }
  .bubble-form button { font: inherit; padding: 6px 12px; border: 0; border-radius: 10px; background: #2f7be8; color: #fff; cursor: pointer; }
  .bubble-form .mic { padding: 6px 9px; display: inline-flex; align-items: center; }
  .bubble-form .mic[hidden] { display: none; }
  .bubble-form .mic.on { background: #d6304a; animation: mic-pulse 1.1s ease-in-out infinite; }
  @keyframes mic-pulse { 50% { box-shadow: 0 0 0 5px rgba(214,48,74,.25); } }
  @media (prefers-reduced-motion: reduce) { .bubble-form .mic.on { animation: none; } }
  .bubble-form .ghost { background: transparent; color: #2b5fae; border: 1px solid #9db8dd; }
  .bubble-form .ghost[hidden] { display: none; }
  .bubble-form input:focus-visible, .bubble-form button:focus-visible { outline: 2px solid #0b4fb3; outline-offset: 2px; }
  .bubble-error { margin: 6px 0 0; color: #a3322c; font-size: 13px; min-height: 0; }
  .bubble-error:empty { display: none; }
  .panel { width: 330px; max-width: 330px; z-index: 6; max-height: calc(100vh - 60px); overflow-y: auto; }
  .panel h2 { margin: 0 0 8px; font-size: 16px; }
  .panel-field { display: block; margin: 8px 0 0; font-size: 13px; }
  .panel-field[hidden], .panel-note[hidden] { display: none; }
  .panel-field span { display: block; margin-bottom: 3px; color: #46618d; }
  .panel-field input, .panel-field select { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid #9db8dd; background: #fff; color: inherit; }
  .panel-field input:focus-visible, .panel-field select:focus-visible, .panel button:focus-visible { outline: 2px solid #0b4fb3; outline-offset: 2px; }
  .panel-note { margin: 6px 0 0; font-size: 12px; color: #46618d; }
  .panel-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .panel-buttons button { font: inherit; font-size: 13px; padding: 6px 10px; border: 0; border-radius: 10px; background: #2f7be8; color: #fff; cursor: pointer; }
  .panel-buttons .ghost { background: transparent; color: #2b5fae; border: 1px solid #9db8dd; }
  .power-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; font-size: 13px; }
  .power-row button { font: inherit; font-size: 12px; padding: 4px 8px; border: 0; border-radius: 10px; background: #2f7be8; color: #fff; cursor: pointer; }
  .power-row .ghost { background: transparent; color: #2b5fae; border: 1px solid #9db8dd; }
  .panel h3 { margin: 12px 0 4px; font-size: 13px; }
  .power-log { margin: 0; padding-left: 16px; font-size: 12px; color: #46618d; }
  #watching { position: fixed; right: 12px; top: 12px; padding: 4px 10px; border-radius: 12px; background: #2f7be8; color: #fff; font-size: 12px; z-index: 7; pointer-events: none; }
  #watching[hidden] { display: none; }
  .panel-status { margin: 8px 0 0; font-size: 13px; min-height: 1.2em; }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="over" aria-label="Slimy, ton compagnon"></canvas>
<div id="bubble" class="bubble" role="dialog" aria-live="polite"></div>
<div id="perms" class="bubble panel" role="dialog" aria-label="Pouvoirs"></div>
<div id="watching" hidden></div>
<div id="settings" class="bubble panel" role="dialog" aria-label="Cerveau"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
