# cargo-deny policy. Run: cargo deny check
# The workspace crates carry `license = "MIT"` through [workspace.package].

[graph]
all-features = true

[advisories]
# Unmaintained transitive crates with no safe upgrade: oo7, ashpd and xcap (Linux keyring, portals, screen capture)
# pull the standalone zbus crates, which were merged into zbus 6. Re-check when those crates move to zbus 6.
# These are maintenance notices, not vulnerabilities.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, build-time macro pulled by a dependency" },
    { id = "RUSTSEC-2026-0370", reason = "zbus_names unmaintained, merged into zbus 6, pulled by oo7, ashpd, xcap" },
    { id = "RUSTSEC-2026-0371", reason = "zvariant unmaintained, merged into zbus 6, pulled by oo7, ashpd, xcap" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, merged into zbus 6, pulled by oo7, ashpd, xcap" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# GPL, AGPL and LGPL are not in the allow list, so they are denied.
# r-efi is "MIT OR Apache-2.0 OR LGPL-2.1-or-later": the MIT choice is taken.

[bans]
multiple-versions = "allow"
wildcards = "allow"
# The exception below only applies to the optional `french-voice` feature of the desktop crate (off by default).
# espeak-rs wraps espeak-ng (GPL-3.0-or-later) while declaring MIT, so the license
# check cannot see it. It is the one documented GPL exception: only the desktop
# binary may depend on it, and the French voice must stay a separable option.
deny = [
    { crate = "espeak-rs", wrappers = ["slimy-desktop"], reason = "wraps GPL-3 espeak-ng; optional French voice" },
    { crate = "espeak-rs-sys", wrappers = ["espeak-rs"], reason = "bundles GPL-3 espeak-ng" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
