name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.129"
  HARNESS_PORT: "8765"

jobs:
  linux:
    name: Linux (fmt, clippy, tests, web)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libssl-dev libayatana-appindicator3-dev libxdo-dev \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            xvfb python3

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Install wasm-bindgen-cli (pinned to Cargo.lock)
        run: |
          grep -A1 'name = "wasm-bindgen"$' Cargo.lock | grep -q "version = \"$WASM_BINDGEN_VERSION\"" \
            || { echo "Cargo.lock wasm-bindgen differs from WASM_BINDGEN_VERSION"; exit 1; }
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: Build the web bundle
        run: ./scripts/build-web.sh

      - name: Web unit tests
        working-directory: apps/desktop/web
        run: node --test tests/*.test.mjs

      - name: Headless scenario tests
        working-directory: apps/desktop/web
        run: |
          python3 -m http.server "$HARNESS_PORT" >/tmp/http.log 2>&1 &
          sleep 1
          status=0
          for t in panels skill slimefile voice swallow; do
            echo "== $t"
            xvfb-run -a node "dev/$t-test.mjs" || status=1
          done
          exit $status

  other-os:
    name: Check on ${{ matrix.os }} (best effort)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p slimy-desktop
